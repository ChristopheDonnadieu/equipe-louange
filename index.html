<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Équipe de Louange — Ressources & Formation</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f8f4ec;color:#273b32;margin:0}header{text-align:center;background:#e8dfce;padding:32px 16px}h1{font-family:Georgia,serif;font-size:clamp(28px,4vw,46px);margin:5px}header p{color:#7c6956}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button,input{border:1px solid #d2c3aa;border-radius:10px;padding:11px 14px;background:white;font-size:15px}input{flex:1;min-width:220px}button{cursor:pointer}.branch{border:1px solid #e1d7c8;border-radius:12px;background:white;margin:10px 0;overflow:hidden}.branch>summary{cursor:pointer;padding:17px;font-weight:700;color:#304639;background:#f3eee5;list-style:none}.branch>summary:before{content:'＋';margin-right:12px;color:#b87939}.branch[open]>summary:before{content:'−'}.items{padding:8px 16px 16px 34px}.sub{border-left:2px solid #b8c4aa;padding-left:14px;margin:10px 0}.sub>summary{cursor:pointer;font-weight:650;padding:8px}.leaf{padding:9px 12px;margin:5px 0;border-left:3px solid #d4a06b;background:#fbfaf7;border-radius:4px;font-size:14px}.hidden{display:none!important}footer{text-align:center;color:#786e63;padding:30px;font-size:13px}</style></head><body><header><p>ÉQUIPE DE LOUANGE</p><h1>Ressources & Formation</h1><p>Explorez les dix domaines de formation</p></header><main class="wrap"><div class="controls"><input id="search" placeholder="Rechercher une ressource…" aria-label="Rechercher"><button id="expand">Tout déplier</button><button id="collapse">Tout replier</button></div><div id="tree"></div></main><footer>Catalogue des dossiers · Les ressources ne sont pas encore reliées aux fichiers d'origine.</footer><script>const data={"1 Musique et Technique": {"Musique": ["Claviers et technologies au service de la louange", "Comment bien faire sonner la batterie", "Comment jouer les chants d’Impact à la guitare", "Comment maitriser son souffle", "Comment maitriser une voix instable", "Harmonie – Étude des accords", "Introduction à la guitare", "La basse dans la louange", "Le guitariste au service de la louange", "Le rôle de la batterie dans une équipe de louange", "Piano Gospel", "Sons de guitares et guitares électriques au service de la louange", "Techniques et théorie de base"], "Technique": ["Le sonorisateur au service de la louange", "Les médias au service de la louange"]}, "2 Perspective biblique": ["Comment avoir un ciel ouvert dans une assemblée", "Comprendre la louange", "La passion", "La puissance de la louange", "Le caractère du musicien", "Le coeur d’adorateur", "Le coeur du lévite", "Le musicien serviteur", "Les expressions bibliques de la louange", "Les guerriers de l’invisible", "Perspective biblique de la louange les expressions et manifestations"], "3 Le ministère pratique": ["Comment amener le peuple dans la louange", "Comment combiner excellence et direction de l’Esprit", "Comment créer une connexion avec son auditoire", "Comment donner une direction musicale", "Conduire la louange", "Diriger la louange", "La direction musicale dans le flot", "La louange parmi les enfants", "La préparation du musicien", "La puissance du flot", "Le groupe de louange (Rôles et défis)", "Le rôle des choristes dans une équipe de louange", "Louange prophétique et chant spontané"], "4 Leadership": ["Administration département louange", "Comment amener des changements", "Comment démarrer un ministère de louange", "Comment développer une équipe de louange", "Comment mettre en place une vision", "Le conducteur de louange"], "5 Ministère artistique": ["Comment réaliser notre destinée musicale", "L’organisation d’une setliste", "La direction musicale", "Les 9 étapes de la réalisation d’un album"], "6 Développement personnel": ["Comment vivre son rêve musical", "La place de la femme dans le ministère", "La place de la femme dans le ministère de la louange", "Une vie d’adoration"], "7 Avoir de l'impact": ["Comment atteindre l’excellence", "Comment revisiter un chant connu", "Les dix commandements de l’excellence"], "8 Culture générale": ["La louange à travers les ages", "La louange de la genèse à aujourd’hui"], "9 Créativité": ["Comment développer sa créativité", "Composer un chant de louange", "La créativité dans le déroulement", "La place des arts dans l’Église", "Les mots au service de la louange"], "10 Webinars/Panel": ["Amélioration d’un département de louange en 10 points – Webi.mp4", "Worship Panel – Comment composer un chant de louange – Acadé.mp4", "Worship Panel – Le conducteur de louange – Académie Exponenc.mp4"]};const tree=document.getElementById('tree');function leaf(s){const d=document.createElement('div');d.className='leaf';d.textContent=s;return d}function folder(name,items,cls){const d=document.createElement('details');d.className=cls;const s=document.createElement('summary');s.textContent=name;d.append(s);const box=document.createElement('div');box.className='items';if(Array.isArray(items)){items.forEach(x=>box.append(leaf(x)))}else{Object.entries(items).forEach(([k,v])=>box.append(folder(k,v,'sub')))}d.append(box);return d}Object.entries(data).forEach(([k,v])=>tree.append(folder(k,v,'branch')));document.getElementById('expand').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);document.getElementById('collapse').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.toLocaleLowerCase('fr').trim();document.querySelectorAll('.leaf').forEach(el=>el.classList.toggle('hidden',!!q&&!el.textContent.toLocaleLowerCase('fr').includes(q)));document.querySelectorAll('.sub,.branch').forEach(el=>{let found=!q||el.querySelector('.leaf:not(.hidden)')||el.querySelector('summary').textContent.toLocaleLowerCase('fr').includes(q);el.classList.toggle('hidden',!found);if(q&&found)el.open=true})});</script></body></html>
